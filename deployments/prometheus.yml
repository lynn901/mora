# prometheus.yml — Mora 平台指标采集
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "mora-api"
    static_configs:
      - targets: ["mora-api:8080"]
    metrics_path: "/metrics"

  - job_name: "mcp-server"
    static_configs:
      - targets: ["mcp-server:8081"]
    metrics_path: "/metrics"

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
