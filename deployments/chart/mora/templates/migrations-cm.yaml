# 自动生成 -- 由 generate-migrations-cm.sh 创建，不要手动编辑。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mora.fullname" . }}-migrations
  labels:
    {{- include "mora.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
data:
  run-migrations.sh: |
    #!/bin/sh
    # deployments/run-migrations.sh
    # 幂等执行 PostgreSQL 迁移：用 schema_migrations 表记录已应用版本，重复
    # `docker compose up` 不会重复执行。按文件名顺序应用 0??_*.up.sql。
    # 在 postgres:16 镜像中运行（含 psql + sh）。
    set -e

    : "${PGHOST:=postgres}"
    : "${PGPORT:=5432}"
    : "${PGUSER:=mora}"
    : "${PGDATABASE:=mora}"
    export PGPASSWORD="${POSTGRES_PASSWORD:-mora}"

    PSQL="psql -h $PGHOST -p $PGPORT -U $PGUSER -d $PGDATABASE -v ON_ERROR_STOP=1"

    # 等待 postgres 就绪
    until $PSQL -c "SELECT 1" >/dev/null 2>&1; do
      echo "migrate: waiting for postgres..."
      sleep 1
    done

    $PSQL -c "CREATE TABLE IF NOT EXISTS schema_migrations (version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT now());"

    applied=0
    for f in /migrations/0??_*.up.sql; do
      [ -f "$f" ] || continue
      v=$(basename "$f" .up.sql)
      if $PSQL -tAc "SELECT 1 FROM schema_migrations WHERE version='$v'" | grep -q 1; then
        echo "migrate: skip $v (already applied)"
        continue
      fi
      echo "migrate: applying $v"
      $PSQL -f "$f"
      $PSQL -c "INSERT INTO schema_migrations (version) VALUES ('$v') ON CONFLICT DO NOTHING;"
      applied=$((applied + 1))
    done

    echo "migrate: done ($applied newly applied, $(ls /migrations/0??_*.up.sql | wc -l) total)"
  001_users.down.sql: |
    -- migrations/001_users.down.sql
    DROP TABLE IF EXISTS group_members;
    DROP TABLE IF EXISTS groups;
    DROP TABLE IF EXISTS service_accounts;
    DROP TABLE IF EXISTS users;
    DROP TEXT SEARCH CONFIGURATION IF EXISTS chinese_zh;
  001_users.up.sql: |
    -- migrations/001_users.up.sql
    -- 用户与身份（对应 03-data-model.md §2.1）

    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    -- ltree 目录树物化路径
    CREATE EXTENSION IF NOT EXISTS "ltree";

    -- zhparser 中文分词：若系统未安装则降级为 simple（应用层通过 FTS_CONFIG 切换）。
    -- 不能用 CREATE EXTENSION IF NOT EXISTS（扩展不可用时仍会报错），用 DO 块捕获。
    DO $$
    BEGIN
        CREATE EXTENSION IF NOT EXISTS "zhparser";
    EXCEPTION WHEN OTHERS THEN
        -- zhparser 未安装时跳过；全文检索降级为 simple 配置
        NULL;
    END $$;

    -- zhparser 中文全文检索配置（若扩展存在）
    DO $$
    BEGIN
        IF EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'zhparser') THEN
            CREATE TEXT SEARCH CONFIGURATION chinese_zh (PARSER = zhparser);
            ALTER TEXT SEARCH CONFIGURATION chinese_zh
                ADD MAPPING FOR n,v,a,i,e,l WITH simple;
        END IF;
    EXCEPTION WHEN OTHERS THEN
        NULL;
    END $$;

    -- 用户
    CREATE TABLE users (
        id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        email         VARCHAR(255) NOT NULL UNIQUE,
        name          VARCHAR(255) NOT NULL,
        password_hash VARCHAR(255),
        avatar_url    TEXT,
        status        VARCHAR(20) NOT NULL DEFAULT 'active',
        created_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at    TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- 用户组（对接组织架构）
    CREATE TABLE groups (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        name        VARCHAR(255) NOT NULL,
        description TEXT,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE group_members (
        group_id UUID NOT NULL REFERENCES groups(id) ON DELETE CASCADE,
        user_id  UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        PRIMARY KEY (group_id, user_id)
    );

    -- 服务账号（供 API Token 绑定）
    CREATE TABLE service_accounts (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        name        VARCHAR(255) NOT NULL,
        description TEXT,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- 系统内置超级管理员（占位，实际由部署脚本注入）
    INSERT INTO users (email, name, status) VALUES
        ('admin@mora.local', 'System Admin', 'active')
    ON CONFLICT (email) DO NOTHING;
  002_workspaces.down.sql: |
    -- migrations/002_workspaces.down.sql
    DROP TABLE IF EXISTS directories;
    DROP TABLE IF EXISTS workspaces;
  002_workspaces.up.sql: |
    -- migrations/002_workspaces.up.sql
    -- 工作区与目录（对应 03-data-model.md §2.2）

    CREATE TABLE workspaces (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        name        VARCHAR(255) NOT NULL,
        slug        VARCHAR(255) NOT NULL UNIQUE,
        description TEXT,
        owner_id    UUID NOT NULL REFERENCES users(id),
        settings    JSONB NOT NULL DEFAULT '{}',
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- 目录（无限极树，ltree 物化路径）
    CREATE TABLE directories (
        id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        workspace_id  UUID NOT NULL REFERENCES workspaces(id) ON DELETE CASCADE,
        parent_id     UUID REFERENCES directories(id) ON DELETE CASCADE,
        name          VARCHAR(255) NOT NULL,
        path          LTREE NOT NULL,
        sort_order    INTEGER NOT NULL DEFAULT 0,
        created_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at    TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- 父目录必须属于同一工作区（CHECK 约束不支持子查询，用触发器实现）
    CREATE OR REPLACE FUNCTION chk_directory_parent_workspace() RETURNS trigger AS $$
    BEGIN
        IF NEW.parent_id IS NOT NULL THEN
            IF NOT EXISTS (SELECT 1 FROM directories p
                           WHERE p.id = NEW.parent_id AND p.workspace_id = NEW.workspace_id) THEN
                RAISE EXCEPTION 'parent directory must belong to the same workspace';
            END IF;
        END IF;
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    CREATE TRIGGER trg_directory_parent_workspace
        BEFORE INSERT OR UPDATE ON directories
        FOR EACH ROW EXECUTE FUNCTION chk_directory_parent_workspace();

    CREATE INDEX idx_directories_workspace ON directories(workspace_id);
    CREATE INDEX idx_directories_parent ON directories(parent_id);
    CREATE INDEX idx_directories_path ON directories USING GIST(path);
    CREATE INDEX idx_directories_workspace_path ON directories(workspace_id, path);
  003_documents.down.sql: |
    -- migrations/003_documents.down.sql
