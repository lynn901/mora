    -- 联调种子数据：让 docker compose up 后即可跑通完整链路（登录→建文档→RAG 索引→MCP 检索）。
    -- 仅用于本地/联调演示，生产部署不应执行此迁移。全部幂等（ON CONFLICT / WHERE NOT EXISTS）。
    -- 依赖：001 users、002 workspaces、005 rbac(roles/permissions)、007 rag(embedding_models)、008 mcp(api_tokens)。

    -- 1. 管理员密码：admin@mora.local / admin123 —— 登录获取 JWT，创建文档触发 doc_event。
    --    明文不落库，仅存 bcrypt 哈希（与 handler.HashPassword/CheckPassword 一致）。
    UPDATE users SET password_hash = '$2a$10$dC.Hu.NG4Ar/pGyqlgbKRuV2DL.vOElANeE5EYsuipJkIkXiEKWoS'
    WHERE email = 'admin@mora.local' AND (password_hash IS NULL OR password_hash = '');

    -- 2. 演示工作区（固定 UUID，便于权限/文档引用）。owner = 管理员。
    INSERT INTO workspaces (id, name, slug, description, owner_id)
    SELECT '11111111-1111-1111-1111-111111111111', '工程知识库', 'eng-mora', '联调演示工作区', u.id
    FROM users u WHERE u.email = 'admin@mora.local'
    ON CONFLICT (id) DO NOTHING;

    -- 3. 授予管理员对该工作区的读权限（viewer 角色，workspace subtree 继承）。
    --    使 RAG ViewerScope / ResolveReaders 解析出 user:<admin> 主体，检索可见。
    INSERT INTO permissions (subject_type, subject_id, role_id, target_type, target_id, effect, inherit_scope)
    SELECT 'user', u.id, r.id, 'workspace', '11111111-1111-1111-1111-111111111111', 'allow', 'subtree'
    FROM users u, roles r
    WHERE u.email = 'admin@mora.local' AND r.name = 'viewer' AND r.is_system = true
      AND NOT EXISTS (
        SELECT 1 FROM permissions p
        WHERE p.subject_type='user' AND p.subject_id=u.id
          AND p.target_type='workspace' AND p.target_id='11111111-1111-1111-1111-111111111111'
      )
    LIMIT 1;

    -- 4. 激活 Embedding 模型（TEI / all-MiniLM-L6-v2 / dim 384）—— rag-worker 索引与检索必需。
    --    与 config 默认 EMBEDDING_PROVIDER=tei / EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2 / EMBEDDING_DIM=384 对齐。
    --    轻量模型（~80MB）适合 CPU 联调；生产可切换 Qwen/Qwen3-Embedding-0.6B（dim 1024，需 ≥4GB 内存）。
    --    先停用所有旧 active 模型，再插入/激活新模型（保证 GetActive 返回正确维度）。
    UPDATE embedding_models SET status='inactive' WHERE status='active';
    INSERT INTO embedding_models (provider, model_name, dimension, max_token, status)
    VALUES ('tei', 'sentence-transformers/all-MiniLM-L6-v2', 384, 256, 'active')
    ON CONFLICT (provider, model_name) DO UPDATE SET
        dimension = EXCLUDED.dimension, max_token = EXCLUDED.max_token,
        status = 'active', updated_at = now();

    -- 5. MCP API Token（绑定管理员用户，readwrite）—— mcp-server prod 模式鉴权。
    --    明文：wki_dev_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4 （与 mock 模式 dev token 一致，便于联调复用）。
    --    仅存 SHA-256 哈希（auth.HashToken）。
    INSERT INTO api_tokens (name, token_hash, prefix, identity_type, identity_id, scope)
    SELECT 'dev-token', '15611f355a858b9800b308d515aaaba205a0859283ad42af86578894da069a07',
           'wki_dev_a1b2', 'user', u.id, 'readwrite'
    FROM users u WHERE u.email = 'admin@mora.local'
    ON CONFLICT (token_hash) DO NOTHING;
  011_parse.down.sql: |
    -- migrations/011_parse.down.sql
    -- 回滚文档解析域迁移（10 §4.2.2）

    DROP TABLE IF EXISTS chunk_relations;
    DROP TABLE IF EXISTS parse_configs;
    DROP TABLE IF EXISTS parse_tasks;

    ALTER TABLE documents
        DROP COLUMN IF EXISTS parse_task_id,
        DROP COLUMN IF EXISTS parse_status,
        DROP COLUMN IF EXISTS source_format,
        DROP COLUMN IF EXISTS storage_key;

    DROP INDEX IF EXISTS idx_documents_storage_key;
    DROP INDEX IF EXISTS idx_documents_parse_status;
  011_parse.up.sql: |
    -- migrations/011_parse.up.sql
    -- 文档解析域：解析任务状态机、解析配置模板、parent-child 分块关系
    -- 依据：design-docs/10-document-parsing-design.md §4.2.2 / §6 / §7
    -- 向后兼容：documents 新增列均有默认值，存量文档视为已解析（parse_status='parsed'）

    -- documents 表新增列（ALTER，向后兼容）
    ALTER TABLE documents
        ADD COLUMN IF NOT EXISTS storage_key   TEXT,                                  -- 上传原文件对象存储 key
        ADD COLUMN IF NOT EXISTS source_format VARCHAR(20) NOT NULL DEFAULT '',      -- 上传文件格式: txt/md/html/pdf/docx/...
        ADD COLUMN IF NOT EXISTS parse_status  VARCHAR(20) NOT NULL DEFAULT 'parsed', -- pending/parsing/parsed/failed/skipped
        ADD COLUMN IF NOT EXISTS parse_task_id UUID;                                  -- 关联当前 parse_tasks.id

    CREATE INDEX IF NOT EXISTS idx_documents_parse_status ON documents(parse_status) WHERE status != 'deleted';
    CREATE INDEX IF NOT EXISTS idx_documents_storage_key ON documents(storage_key) WHERE storage_key IS NOT NULL;

    -- 解析任务状态机（与 indexing_tasks 对称，05 §3.1 / 10 §4.3）
    CREATE TABLE IF NOT EXISTS parse_tasks (
        id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        document_id   UUID NOT NULL REFERENCES documents(id) ON DELETE CASCADE,
        event_id      UUID NOT NULL,                            -- 幂等键
        status        VARCHAR(20) NOT NULL DEFAULT 'pending',   -- pending/parsing/parsed/failed
        attempt       INTEGER NOT NULL DEFAULT 0,
        max_attempt   INTEGER NOT NULL DEFAULT 3,
        parse_opts    JSONB NOT NULL DEFAULT '{}',              -- 本次解析配置覆盖（§7）
        parser_name   VARCHAR(100),                             -- 实际使用的 parser
        progress      JSONB NOT NULL DEFAULT '[]',              -- 分阶段进度时间线（§6.3）
        error_message TEXT,
        created_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
        UNIQUE(document_id, event_id)
    );

    CREATE INDEX IF NOT EXISTS idx_parse_tasks_status ON parse_tasks(status, updated_at);
    CREATE INDEX IF NOT EXISTS idx_parse_tasks_document ON parse_tasks(document_id);
    CREATE INDEX IF NOT EXISTS idx_parse_tasks_pending ON parse_tasks(status, created_at) WHERE status IN ('pending','failed');

    -- 解析配置模板（工作区级默认 + 全局默认，供上传时回填，§7）
    CREATE TABLE IF NOT EXISTS parse_configs (
        id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        workspace_id  UUID REFERENCES workspaces(id) ON DELETE CASCADE,  -- NULL=全局默认
        name          VARCHAR(100) NOT NULL,
        config        JSONB NOT NULL DEFAULT '{}',              -- {chunking_strategy, chunk_size, ...}
        is_default    BOOLEAN NOT NULL DEFAULT false,
        created_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
        UNIQUE(workspace_id, name)
    );

    CREATE INDEX IF NOT EXISTS idx_parse_configs_workspace ON parse_configs(workspace_id) WHERE workspace_id IS NOT NULL;
    CREATE INDEX IF NOT EXISTS idx_parse_configs_global ON parse_configs(workspace_id) WHERE workspace_id IS NULL;

    -- parent-child 分块的父子关系（独立表，避免 chunks 表膨胀；P1，§2.3）
    CREATE TABLE IF NOT EXISTS chunk_relations (
        child_chunk_id   UUID NOT NULL REFERENCES chunks(id) ON DELETE CASCADE,
        parent_chunk_id  UUID NOT NULL REFERENCES chunks(id) ON DELETE CASCADE,
        document_id      UUID NOT NULL REFERENCES documents(id) ON DELETE CASCADE,
        PRIMARY KEY (child_chunk_id, parent_chunk_id)
    );

    CREATE INDEX IF NOT EXISTS idx_chunk_relations_parent ON chunk_relations(parent_chunk_id);
    CREATE INDEX IF NOT EXISTS idx_chunk_relations_doc ON chunk_relations(document_id);
