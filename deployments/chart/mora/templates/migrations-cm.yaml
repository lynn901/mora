    -- 系统内置角色
    INSERT INTO roles (name, scope, permissions, is_system) VALUES
        ('super_admin', 'system',  '["read","write","admin"]'::jsonb, true),
        ('workspace_admin', 'workspace', '["read","write","admin"]'::jsonb, true),
        ('editor', 'directory', '["read","write"]'::jsonb, true),
