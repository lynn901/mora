---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mora.fullname" . }}-knowledge-worker
  labels:
    app.kubernetes.io/component: knowledge-worker
    {{- include "mora.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.knowledgeWorker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: knowledge-worker
      {{- include "mora.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: knowledge-worker
        {{- include "mora.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: knowledge-worker
          image: "{{ include "mora.image" . }}{{ .Values.knowledgeWorker.image.repository }}:{{ .Values.knowledgeWorker.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8083
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:$(POSTGRES_PASSWORD)@{{ include "mora.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
            - name: VALKEY_URL
              value: "{{ include "mora.fullname" . }}-valkey:6379"
            - name: QDRANT_URL
              value: "http://{{ include "mora.fullname" . }}-qdrant:6333"
            - name: TEI_URL
              value: "http://{{ include "mora.fullname" . }}-tei:8080"
            - name: CONSUMER_NAME
              value: "knowledge-worker-{{ .Release.Revision }}"
            - name: HEALTH_ADDR
              value: ":8083"
            # 出网白名单（egress allowlist，design-docs/14 §6）。
            # 默认 EGRESS_ALLOW_DOMAINS 为空=不出网；架构红线：默认不出网配置不可改。
            - name: EGRESS_ALLOW_DOMAINS
              value: {{ .Values.config.egressAllowDomains | quote }}
            - name: EGRESS_ALLOW_PRIVATE_RANGES
              value: {{ .Values.config.egressAllowPrivateRanges | quote }}
            - name: EGRESS_MAX_REDIRECTS
              value: {{ .Values.config.egressMaxRedirects | quote }}
            - name: EGRESS_MAX_RESPONSE_BYTES
              value: {{ .Values.config.egressMaxResponseBytes | quote }}
            - name: EGRESS_TIMEOUT
              value: {{ .Values.config.egressTimeout | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mora.fullname" . }}-secrets
                  key: postgres-password
          envFrom:
            - configMapRef:
                name: {{ include "mora.fullname" . }}-config
          resources:
            {{- toYaml .Values.knowledgeWorker.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mora.fullname" . }}-knowledge-worker
  labels:
    app.kubernetes.io/component: knowledge-worker
    {{- include "mora.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.knowledgeWorker.servicePort }}
      targetPort: 8083
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: knowledge-worker
    {{- include "mora.selectorLabels" . | nindent 4 }}
{{- if .Values.knowledgeWorker.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "mora.fullname" . }}-knowledge-worker
  labels:
    app.kubernetes.io/component: knowledge-worker
    {{- include "mora.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "mora.fullname" . }}-knowledge-worker
  minReplicas: {{ .Values.knowledgeWorker.hpa.minReplicas }}
  maxReplicas: {{ .Values.knowledgeWorker.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.knowledgeWorker.hpa.targetCPUUtilizationPercentage }}
{{- end }}
