---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mora.fullname" . }}-mcp-server
  labels:
    app.kubernetes.io/component: mcp-server
    {{- include "mora.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcpServer.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-server
      {{- include "mora.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp-server
        {{- include "mora.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-server
          image: "{{ include "mora.image" . }}{{ .Values.mcpServer.image.repository }}:{{ .Values.mcpServer.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8081
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: ":8081"
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:$(POSTGRES_PASSWORD)@{{ include "mora.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
            - name: VALKEY_URL
              value: "{{ include "mora.fullname" . }}-valkey:6379"
            - name: MORA_API_URL
              value: "http://{{ include "mora.fullname" . }}-mora-api:{{ .Values.moraApi.servicePort }}"
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "mora.fullname" . }}-secrets
                  key: internal-service-token
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mora.fullname" . }}-secrets
                  key: postgres-password
          envFrom:
            - configMapRef:
                name: {{ include "mora.fullname" . }}-config
          resources:
            {{- toYaml .Values.mcpServer.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /mcp/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /mcp/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mora.fullname" . }}-mcp-server
  labels:
    app.kubernetes.io/component: mcp-server
    {{- include "mora.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mcpServer.servicePort }}
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: mcp-server
    {{- include "mora.selectorLabels" . | nindent 4 }}
