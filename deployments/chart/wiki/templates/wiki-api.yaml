---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wiki.fullname" . }}-wiki-api
  labels:
    app.kubernetes.io/component: wiki-api
    {{- include "wiki.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.wikiApi.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: wiki-api
      {{- include "wiki.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: wiki-api
        {{- include "wiki.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wiki-api
          image: "{{ include "wiki.image" . }}{{ .Values.wikiApi.image.repository }}:{{ .Values.wikiApi.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:$(POSTGRES_PASSWORD)@{{ include "wiki.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
            - name: VALKEY_URL
              value: "{{ include "wiki.fullname" . }}-valkey:6379"
            - name: QDRANT_URL
              value: "http://{{ include "wiki.fullname" . }}-qdrant:6333"
            - name: TEI_URL
              value: "http://{{ include "wiki.fullname" . }}-tei:8080"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wiki.fullname" . }}-secrets
                  key: jwt-secret
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "wiki.fullname" . }}-secrets
                  key: internal-service-token
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wiki.fullname" . }}-secrets
                  key: postgres-password
          envFrom:
            - configMapRef:
                name: {{ include "wiki.fullname" . }}-config
          resources:
            {{- toYaml .Values.wikiApi.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wiki.fullname" . }}-wiki-api
  labels:
    app.kubernetes.io/component: wiki-api
    {{- include "wiki.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.wikiApi.servicePort }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: wiki-api
    {{- include "wiki.selectorLabels" . | nindent 4 }}
{{- if .Values.wikiApi.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "wiki.fullname" . }}-wiki-api
  labels:
    app.kubernetes.io/component: wiki-api
    {{- include "wiki.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "wiki.fullname" . }}-wiki-api
  minReplicas: {{ .Values.wikiApi.hpa.minReplicas }}
  maxReplicas: {{ .Values.wikiApi.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.wikiApi.hpa.targetCPUUtilizationPercentage }}
{{- end }}
