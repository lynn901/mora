apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wiki.fullname" . }}-secrets
  labels:
    {{- include "wiki.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.config.jwtSecret | quote }}
  internal-service-token: {{ .Values.config.internalServiceToken | quote }}
  postgres-password: {{ .Values.postgresql.auth.password | default "" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wiki.fullname" . }}-config
  labels:
    {{- include "wiki.labels" . | nindent 4 }}
data:
  JWT_TTL: {{ .Values.config.jwtTTL | quote }}
  EMBEDDING_PROVIDER: {{ .Values.config.embeddingProvider | quote }}
  EMBEDDING_MODEL: {{ .Values.config.embeddingModel | quote }}
  EMBEDDING_DIM: {{ .Values.config.embeddingDim | quote }}
  FTS_CONFIG: {{ .Values.config.ftsConfig | quote }}
  COLLAB_MAX_CONCURRENT: {{ .Values.config.collabMaxConcurrent | quote }}
  RATE_LIMIT_DOC_PER_MIN: {{ .Values.config.rateLimitDocPerMin | quote }}
  RATE_LIMIT_SEARCH_PER_MIN: {{ .Values.config.rateLimitSearchPerMin | quote }}
  MCP_RATE_LIMIT_READ: {{ .Values.config.mcpRateLimitRead | quote }}
  MCP_RATE_LIMIT_WRITE: {{ .Values.config.mcpRateLimitWrite | quote }}
