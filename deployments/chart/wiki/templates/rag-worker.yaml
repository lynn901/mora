---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wiki.fullname" . }}-rag-worker
  labels:
    app.kubernetes.io/component: rag-worker
    {{- include "wiki.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ragWorker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: rag-worker
      {{- include "wiki.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rag-worker
        {{- include "wiki.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rag-worker
          image: "{{ include "wiki.image" . }}{{ .Values.ragWorker.image.repository }}:{{ .Values.ragWorker.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8082
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:$(POSTGRES_PASSWORD)@{{ include "wiki.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
            - name: VALKEY_URL
              value: "{{ include "wiki.fullname" . }}-valkey:6379"
            - name: QDRANT_URL
              value: "http://{{ include "wiki.fullname" . }}-qdrant:6333"
            - name: TEI_URL
              value: "http://{{ include "wiki.fullname" . }}-tei:8080"
            - name: OLLAMA_URL
              value: "http://{{ include "wiki.fullname" . }}-ollama:11434"
            - name: CONSUMER_NAME
              value: "rag-worker-{{ .Release.Revision }}"
            - name: HEALTH_ADDR
              value: ":8082"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wiki.fullname" . }}-secrets
                  key: postgres-password
          envFrom:
            - configMapRef:
                name: {{ include "wiki.fullname" . }}-config
          resources:
            {{- toYaml .Values.ragWorker.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
