# Mora 平台单机部署（试用 / ≤50 人）。
# 一键 `docker compose up -d` 拉起全部组件：前端（nginx） + 3 应用（mora-api / rag-worker / mcp-server）
# + 4 基础设施（postgres / valkey / qdrant / tei）+ 1 迁移 init 容器，数据卷本地挂载，100% 私有化。
# 对应架构设计 02-system-architecture.md §3.1。
#
# 启动顺序：postgres(healthy) → valkey/qdrant/tei(started) → migrate(completed)
#           → mora-api(healthy) → frontend + rag-worker + mcp-server(healthy)。
# 默认 TEI 作为 Embedding 推理；可选 Ollama：`docker compose --profile ollama up -d`。
# 可选可观测：Prometheus + Grafana：`docker compose --profile monitoring up -d`。
# 可选 P2 多模态解析 sidecar：`docker compose --profile parser up -d`
#   （版式 PDF/OCR/VLM/ASR；启用后设 MORA_PARSER_URL=http://mora-parser:8000）。
#
# 联调迁移注入：管理员 admin@mora.local/admin123、演示工作区、
# 激活的 embedding 模型、MCP dev token(mora_dev_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4)。
#
# 宿主端口冲突时用环境变量覆盖（无需改文件）：
#   MORA_API_PORT=9000 MCP_SERVER_PORT=9001 docker compose up -d
# 或先清理残留容器：docker compose down && docker compose up -d

services:
  # ---------- 基础设施 ----------

  postgres:
    image: postgres:16
    volumes: ["pg_data:/var/lib/postgresql/data"]
    environment:
      POSTGRES_DB: mora
      POSTGRES_USER: mora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mora}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mora -d mora"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:7.2
    volumes: ["valkey_data:/data"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.0
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      # qdrant 镜像无 curl/wget；用 bash /dev/tcp 探测 6333 端口存活。
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # 对象存储：多格式文档解析上传原文件 + 解析产物（design-docs/10 §4.2.1）。
    # S3 兼容；mora-api/rag-worker 通过 MINIO_* 环境变量访问。
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-mora}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-mora-secret}
    volumes: ["minio_data:/data"]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  tei:
    # HuggingFace Text Embeddings Inference（本地推理，默认 TEI）。
    # cpu-latest 镜像修复了 cpu-1.5 的 HF 下载 bug（relative URL without a base）。
    # 默认模型 all-MiniLM-L6-v2（dim 384，~80MB）轻量稳定，适合 CPU 联调；
    # 生产可改 EMBEDDING_MODEL=Qwen/Qwen3-Embedding-0.6B（需 ≥4GB 内存）。
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: ["--model-id", "${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}", "--port", "8080"]
    volumes: ["tei_cache:/data"]
    healthcheck:
      # TEI 监听 8080；用 bash /dev/tcp 探测端口（模型加载完成后才监听）。
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 120s
    restart: unless-stopped

  ollama:
    # Ollama 作为 TEI 的备选 Embedding Provider（EMBEDDING_PROVIDER=ollama）。
    # 默认不启动；`docker compose --profile ollama up -d` 拉起后需 `ollama pull <model>`。
    # 同时作为 P2 VLM 图像描述的推理后端（PARSE_VLM_MODEL，design-docs/10 §3.2）。
    profiles: ["ollama"]
    image: ollama/ollama:0.3.0
    volumes: ["ollama_data:/root/.ollama"]
    restart: unless-stopped

  # ---------- P2 多模态解析 sidecar（profile: parser）----------
  # design-docs/10 §1.4：单一可插拔 Python sidecar，承载版式 PDF/OCR/VLM/ASR。
  # 启用：docker compose --profile parser up -d，并在 .env 设
  #   MORA_PARSER_URL=http://mora-parser:8000
  #   WHISPER_URL=http://mora-parser:8001   # ASR（whisper.cpp server，sidecar 内或独立）
  # 权重可从挂载的 parser_models 卷加载，也可按配置连接模型服务。
  # P0/P1 不依赖本服务（纯 Go 库覆盖文本 PDF/Word/Excel/PPT/EPUB/MHTML/CSV）。

  mora-parser:
    # 多模态/复杂版式解析 sidecar（PaddleOCR CPU 默认 / markitdown / VLM via Ollama）。
    # app 代码为 P2 范围，当前为部署脚手架；MORA_PARSER_URL 为空时 rag-worker 自动禁用。
    profiles: ["parser", "gpu-parser"]
    build:
      context: ..
      dockerfile: deployments/Dockerfile.mora-parser
    depends_on:
      minio: { condition: service_healthy }   # sidecar 从对象存储读 storage_key
    environment:
      # 指向同网 MinIO，复用 rag-worker 的对象存储凭据
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-mora}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-mora-secret}"
      MINIO_BUCKET: "mora"
      MINIO_SECURE: "false"
      # VLM 复用 Ollama（须 --profile ollama 同起）；空=禁用 VLM
      OLLAMA_URL: "${OLLAMA_URL:-http://ollama:11434}"
      PARSE_VLM_MODEL: "${PARSE_VLM_MODEL:-minicpm-v}"
      PARSE_OCR_DEFAULT_LANG: "${PARSE_OCR_DEFAULT_LANG:-chi_sim+eng}"
      # 共享密钥（rag-worker 侧 X-Sidecar-Token）；默认无
      SIDECAR_TOKEN: "${MORA_PARSER_TOKEN:-}"
    volumes:
      - parser_models:/models:ro   # 预置权重卷，运行期只读
    # 端口默认不暴露宿主（仅同网可达）；调试需暴露时设 MORA_PARSER_PORT
    ports: ["${MORA_PARSER_PORT:-8000}:8000"]
    healthcheck:
      # app 代码就位后启用：test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      # 脚手架期用占位探针，避免 sidecar 未就绪时被依赖
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  # ---------- 迁移 init 容器 ----------

  migrate:
    image: postgres:16
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ../migrations:/migrations:ro
      - ./run-migrations.sh:/run-migrations.sh:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mora}
    entrypoint: ["sh", "/run-migrations.sh"]
    restart: "no" # 一次性任务，由 schema_migrations 保证幂等

  # ---------- 前端（nginx 托管 Vite 产物）----------

  frontend:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.web
    ports: ["${MORA_FRONTEND_PORT:-3010}:80"]
    depends_on:
      mora-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- 应用服务 ----------

  mora-api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        TARGET: mora-api
    ports: ["${MORA_API_PORT:-8990}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://mora:${POSTGRES_PASSWORD:-mora}@postgres:5432/mora?sslmode=disable"
      VALKEY_URL: "valkey:6379"
      QDRANT_URL: "http://qdrant:6333"
      TEI_URL: "http://tei:8080"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-tei}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}"
      EMBEDDING_DIM: "${EMBEDDING_DIM:-384}"
      FTS_CONFIG: "${FTS_CONFIG:-simple}" # postgres:16 无 zhparser，用 simple；装了 zhparser 改 chinese_zh
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-mora-internal-token}"
      COLLAB_MAX_CONCURRENT: "50"
      RATE_LIMIT_DOC_PER_MIN: "300"
      RATE_LIMIT_SEARCH_PER_MIN: "200"
      # 对象存储 + 多格式解析（design-docs/10）
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-mora}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-mora-secret}"
      MINIO_BUCKET: "mora"
      MINIO_SECURE: "false"
      PARSE_MAX_FILE_MB: "${PARSE_MAX_FILE_MB:-100}"
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  rag-worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        TARGET: rag-worker
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
      tei: { condition: service_started } # TEI 模型加载较慢；worker 自带重试，不阻塞启动
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: "postgres://mora:${POSTGRES_PASSWORD:-mora}@postgres:5432/mora?sslmode=disable"
      VALKEY_URL: "valkey:6379"
      QDRANT_URL: "http://qdrant:6333"
      TEI_URL: "http://tei:8080"
      OLLAMA_URL: "http://ollama:11434"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-tei}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}"
      EMBEDDING_DIM: "${EMBEDDING_DIM:-384}"
      CONSUMER_NAME: "rag-worker-1"
      HEALTH_ADDR: ":8082"
      # 对象存储 + 多格式解析（design-docs/10）：worker 消费 document.parse 事件
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-mora}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-mora-secret}"
      MINIO_BUCKET: "mora"
      MINIO_SECURE: "false"
      MORA_PARSER_URL: "${MORA_PARSER_URL:-}"   # P2 多模态 sidecar；空=禁用
      WHISPER_URL: "${WHISPER_URL:-}"           # P2 ASR；空=禁用
      PARSE_TASK_MAX_ATTEMPT: "${PARSE_TASK_MAX_ATTEMPT:-3}"
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://localhost:8082/healthz"]
      interval: 15s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mcp-server:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        TARGET: mcp-server
    ports: ["${MCP_SERVER_PORT:-8081}:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      mora-api: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: "postgres://mora:${POSTGRES_PASSWORD:-mora}@postgres:5432/mora?sslmode=disable"
      VALKEY_URL: "valkey:6379"
      MORA_API_URL: "http://mora-api:8080"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-mora-internal-token}"
      MCP_RATE_LIMIT_READ: "100"
      MCP_RATE_LIMIT_WRITE: "20"
      # 不设 MCP_USE_MOCK → prod 模式（PG token/session/audit + Valkey 限流 + HTTP MoraClient）
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://localhost:8081/mcp/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  yjs-server:
    build:
      context: .
      dockerfile: Dockerfile.yjs
    ports: ["${YJS_PORT:-1234}:1234"]
    environment:
      HOST: "0.0.0.0"
      PORT: "1234"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(1234,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ---------- 可观测（profile: monitoring）----------

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.1.0
    ports: ["${GRAFANA_PORT:-3030}:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${MONITORING_PASS:-admin}"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_started }
    restart: unless-stopped

  # ---------- 定时备份（profile: backup）----------
  # 每日凌晨 3:00 执行备份，保留 30 天。
  # 用法: docker compose --profile backup up -d

  backup-cron:
    profiles: ["backup"]
    image: alpine:3.20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ./export.sh:/usr/local/bin/export.sh:ro
      - ../migrations:/migrations:ro
      - ../.gitignore:/etc/backup/.gitignore:ro
      - backup_export:/backup
    environment:
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
      COMPOSE_FILE: "/host/deployments/docker-compose.yml"
      COMPOSE_PROJECT: "mora"
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache docker-cli docker-compose py3-pip curl bash >/dev/null 2>/dev/null
        pip3 install --quiet pyyaml 2>/dev/null || true
        echo "backup-cron: starting daily backup at 3:00 AM"
        while true; do
          CURRENT_TS=$$(date +%s)
          TARGET_TS=$$(date -d "tomorrow 03:00" +%s)
          SLEEP_SEC=$$((TARGET_TS - CURRENT_TS))
          echo "backup-cron: next backup at $$(date -d @$$TARGET_TS), sleeping $$SLEEP_SEC s"
          sleep $$SLEEP_SEC
          echo "backup-cron: running backup..."
          /usr/local/bin/backup.sh /backup/$$(date +%Y-%m-%d_%H%M%S) || echo "backup-cron: backup failed"
          # 每周日执行一次全量导出
          if [ "$$(date +%u)" = "7" ]; then
            echo "backup-cron: running weekly full export..."
            /usr/local/bin/export.sh export /backup/mora-weekly-$$(date +%Y%m%d).tar.gz || echo "backup-cron: export failed"
          fi
        done
    restart: unless-stopped

volumes:
  pg_data:
  valkey_data:
  qdrant_data:
  minio_data:
  parser_models:
  tei_cache:
  ollama_data:
  prometheus_data:
  grafana_data:
  backup_export:
